name: Deploy Blade

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Application Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/blade:latest
          cache-from: type=gha,scope=blade-app
          cache-to: type=gha,mode=max,scope=blade-app

  deploy:
    name: Deploy to Home Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            echo "=== STARTING BLADE DEPLOYMENT ==="
            # 1. Pull the newly published image from GitHub Container Registry
            docker pull ghcr.io/${{ github.repository_owner }}/blade:latest
            
            # 2. Extract configuration from the currently running Blade container (if exists)
            echo "Checking existing Blade container..."
            if docker ps -a --format '{{.Names}}' | grep -Eq "^Blade$"; then
              echo "Extracting environment variables and volume mounts..."
              ENV_VARS=$(docker inspect --format='{{range .Config.Env}}-e "{{.}}" {{end}}' Blade || true)
              VOLUME_MOUNTS=$(docker inspect --format='{{range .Mounts}}-v {{.Name}}:{{.Destination}} {{end}}' Blade || true)
              echo "Stopping and removing existing Blade container..."
              docker stop Blade || true
              docker rm Blade || true
            else
              echo "No existing Blade container found. Initializing new deployment..."
              ENV_VARS=""
              VOLUME_MOUNTS=""
            fi
            
            # 3. Start the container with port 2323 exposed for Telnet access
            echo "Starting Blade container on port 2323..."
            eval "docker run -d --name Blade -p 2323:2323 --restart unless-stopped --label net.unraid.docker.managed=dockerman $VOLUME_MOUNTS $ENV_VARS ghcr.io/${{ github.repository_owner }}/blade:latest"
            
            echo "=== BLADE DEPLOYMENT COMPLETED ==="
